[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "eta-rxncat"
version = "0.2.0"
description = "Permissively licensed computational catalysis and reaction-mechanism workflow library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Thomas J. L. Mustard Ph.D." }]
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "rdkit",
    "pyscf",
]

[project.optional-dependencies]
gpu = ["torch>=2.7.0", "gpu4pyscf-cuda12x>=1.8.0", "cupy-cuda12x"]
mlip-mace = ["torch>=2.7.0", "mace-torch"]
mlip-uma = ["torch>=2.7.0", "fairchem-core>=2.22"]
opt-geometric = ["geometric==1.1.1"]

[project.scripts]
eta-rxncat = "eta_rxncat.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "geometric==1.1.1",
]

[tool.uv]
conflicts = [[{ extra = "mlip-mace" }, { extra = "mlip-uma" }]]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129" }]

[tool.hatch.build.targets.wheel]
packages = ["src/eta_rxncat"]

[tool.ruff]
line-length = 100
force-exclude = true
extend-exclude = ["docs/prd", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["eta_rxncat"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "gpu4pyscf.*", "cupy.*", "pyscf.*", "rdkit.*", "geometric.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "docs", "*.egg"]
markers = [
    "gpu: needs a CUDA GPU and the gpu extra",
    "xtb: needs the external xtb binary on PATH",
    "mlip_mace: needs the mlip-mace extra and a local MACE model file",
    "mlip_uma: needs the mlip-uma extra and UMA weights in the HF cache or a local checkpoint",
    "slow: DFT finite-difference checks, too slow for the default suite",
    "acceptance: acceptance run in a .venv-accept-* env (ETA_RXNCAT_ACCEPTANCE=1)",
    "e2e: end-to-end human-fixture runs that write candidate outputs (v0.3.0 slice 07)",
]
addopts = "-m 'not gpu and not xtb and not mlip_mace and not mlip_uma and not slow and not acceptance and not e2e'"

[tool.eta-rxncat.licence-gate]
# Exact licence gate (R45, ADR-0013 PROPOSED), run by tools/licence_gate.py with the target env's
# interpreter. Replaces the pip-licenses --partial-match allow-list (slice 01 / R3 / R41), which
# passed LGPL matscipy on the substring "MIT" in "PERMITTED". No substring matching anywhere.
allowed = [
    "MIT", "MIT-0", "MIT-CMU", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "Apache-2.0", "ISC", "PSF-2.0", "Python-2.0", "Zlib", "CC0-1.0", "BSL-1.0",
]
allowed-exceptions = ["LLVM-exception"]

[tool.eta-rxncat.licence-gate.classifiers]
# Last segment of a "License ::" classifier -> SPDX id or LicenseRef-*.
"MIT License" = "MIT"
"BSD License" = "BSD-3-Clause"
"Apache Software License" = "Apache-2.0"
"ISC License (ISCL)" = "ISC"
"Python Software Foundation License" = "PSF-2.0"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"GNU General Public License (GPL)" = "LicenseRef-GPL-unversioned"
"GNU Library or Lesser General Public License (LGPL)" = "LicenseRef-LGPL-unversioned"
"Other/Proprietary License" = "LicenseRef-Proprietary"

[tool.eta-rxncat.licence-gate.names]
# Exact (case-insensitive) short License-field strings -> SPDX id or LicenseRef-*.
"MIT" = "MIT"
"MIT License" = "MIT"
"BSD" = "BSD-3-Clause"
"BSD License" = "BSD-3-Clause"
"3-Clause BSD License" = "BSD-3-Clause"
"Apache 2.0" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"Apache Software License" = "Apache-2.0"
"NVIDIA Proprietary Software" = "LicenseRef-NVIDIA-Proprietary"

[tool.eta-rxncat.licence-gate.nvidia-rule]
prefix = "nvidia-"
licences = ["LicenseRef-Proprietary", "LicenseRef-NVIDIA-Proprietary"]
profiles = ["gpu", "mlip-mace", "mlip-uma"]
reason = "NVIDIA CUDA runtime wheels pulled in by the cu129 torch and CUDA extras"
decision = "TJ Q1 A (qitem-20261122075815-4c32a48f2e42363c)"

[[tool.eta-rxncat.licence-gate.exempt]]
package = "geometric"
version = "1.1.1"
profiles = ["opt-geometric"]
licence = "metadata UNKNOWN; LICENSE file BSD 3-clause Non-AI"
pulled-in-by = "opt-geometric"
reason = "BSD 3-clause Non-AI (clause 4 restricts AI-training datasets); metadata UNKNOWN"
decision = "R41 / ADR-0011 (TJ B, 12:49Z); TJ v0.3.0 Q3 A (opt-geometric extra)"

