  description: >-
    uv-managed MIT package skeleton (hatchling, src layout, Python >=3.11,<3.14, committed
    uv.lock). Runtime deps numpy, scipy, pydantic>=2, pyyaml, rdkit, geometric, pyscf.
    Extras (floors only): gpu = torch>=2.7.0, gpu4pyscf-cuda12x>=1.8.0, cupy-cuda12x;
    mlip-mace = torch, mace-torch; mlip-uma = torch, fairchem-core>=2.22; [tool.uv]
    conflicts keeps the MLIP extras exclusive; torch only from the explicit pytorch-cu129
    index (torch 2.13.0+cu129, re-proved in docs/prd/v0.2.0/evidence/). [project.scripts]
    eta-rxncat = eta_rxncat.cli:main. __init__ exposes __version__ and imports no
    backend; conformers, mapping, optimize, orchestrator are placeholders (engines
    is its own node). Gates: ruff, strict mypy over src and tools, pytest. Test policy
    (ADR-0019): markers gpu, xtb, mlip_mace, mlip_uma, slow, acceptance, all deselected
    by addopts; tests/conftest.py sets HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE=1 for the
    session and, under ETA_RXNCAT_ACCEPTANCE=1, fails every setup/call/collection
    skip and every xfail (R32); an AST rule bans module-level skips in engine and
    acceptance tests; acceptance envs .venv-accept-{gpu,mace,uma} are gitignored.
    Licence gate tools/licence_gate.py (--profile base|gpu|mlip-mace|mlip-uma) judges
    each installed distribution exactly against [tool.eta-rxncat.licence-gate] (allowed
    includes BSL-1.0) with version-pinned per-profile exemptions; stale ones fail;
    an unnamed dist-info or two dist-infos with one PEP 503 name fail. tests/unit/test_package.py
    bans copyleft and sella/tblite/psi4 imports and checks the engines import loads
    no heavy library. CI: checks plus licence-extras matrix. Public face: README.md,
    CHANGELOG.md (scribe-owned), size-named WebP media (tests/unit/test_media.py),
    LICENSE (MIT); author form Thomas J. L. Mustard Ph.D. enforced by tests/unit/test_identity.py.
    docs/prd/v0.1.0/ and docs/prd/v0.2.0/ hold the verbatim starters (ruff-gated by
    .ruff.toml) and each version's DISCREPANCIES.md; docs/prd/PLAN_DISCREPANCIES.md
    the plan-copy register.
