    judges every installed dist exactly against [tool.eta-rxncat.licence-gate] with
    version-pinned profile exemptions (base none; geometric 1.1.1 in opt-geometric
    and, via gpu4pyscf-cuda12x, gpu/mlip-*); stale exemptions, unnamed/duplicate dist-infos
