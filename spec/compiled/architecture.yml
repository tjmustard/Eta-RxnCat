    with gpu marker deselected. Runtime-only licence gate: [tool.pip-licenses] allow-only
    MIT;BSD;Apache;ISC;PSF with one version-pinned exception geometric:1.1.1 (ADR-0011),
    run against .venv-runtime with pip-licenses 5.5.5. CI (.github/workflows/ci.yml)
    runs uv sync --locked, the four gates and the licence gate. docs/prd/v0.1.0/ holds
    the verbatim v0.1.0 reference starter (23 files + .ruff.toml gate file) and DISCREPANCIES.md;
