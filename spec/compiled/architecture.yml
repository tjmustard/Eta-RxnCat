- id: eta_rxncat_optimize
  dimension: Module
  status: clean
  associated_file: src/eta_rxncat/optimize/base.py
  files:
  - src/eta_rxncat/optimize/**
  - tests/unit/optimize/**
  description: >-
    eta_rxncat.optimize: geometry optimizers (v0.3.0), clean-room P-RFO TS search
    (v0.5.0). geomeTRIC: optional opt-geometric extra, never imported by core or the
    base install. errors.py: OptimizerError -> OptimizerUnavailableError (names the
    extra), OptimizerInputError, OptimizationFailedError(steps, last_energy_hartree)
    -> TSSearchFailedError(reason: max_steps|too_many_rejections|mode_lost|no_reaction_mode|wall_time_exceeded).
    base.py (pure Python): Optimizer ABC (identity, OPTIONS by ADR-0016, minimize(state,
    engine, *, frozen_atom_indices, dihedral_constraints, options) -> OptimizationResult);
    DihedralConstraint; check_constraints; constraints_text (canonical freeze:/dihedral:
    text, options["constraints"]); capture_frames() ContextVar sink holds a run's
    frames when it raises. geometric_impl.py: GeometricOptimizer imports geomeTRIC
    only in functions; OptParams, Molecule, coordsys tric/cart/dlc/hdlc, parse_constraints,
    optimizeGeometry via a bridge to Engine.evaluate (never catches EngineError) that
    appends an OptimizationFrame per call (ladder_step; accepted_bool from the step's
    optim.xyz at 1e-6 A, never raises); each step in a temp dir and a locked process-wide
    temp cwd under TMPDIR, cwd, logger, numpy RNG restored (v0.7.0 R8, R33). Options
    coordsys, convergence_set, maxiter, trust, hessian; ladder tric, tric_tight_trust,
    then cartesian or hdlc. ts_base.py (pure Python, R12): TransitionStateOptimizer
    ABC; find_saddle(state, engine, *, forming_bonds, options) -> TSSearchResult;
    'constraints' refused, no frozen atoms or dihedrals (R21). prfo.py (numpy, base
