- id: eta_rxncat_core
  dimension: Module
  status: clean
  files:
  - src/eta_rxncat/core/**
  - tests/unit/core/**
  - tests/data/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.core (v0.1.0): strict, frozen Pydantic v2 contracts (extra=forbid)
    and the ReactionGraph loader. elements.py: immutable Z 1-118 symbol tuple and
    ATOMIC_NUMBERS map. models.py: MolecularState (canonical symbols, finite N x 3
    Angstrom coordinates, required StrictInt charge and spin_multiplicity >= 1 with
    electron-count parity check, unique active_atom_indices, scalar metadata); Solvation
    (none/ddcosmo/pcm/alpb); StageConfig (stage kind, engine tag rdkit_ff/mace/uma_direct/pyscf_gpu_cpu/xtb_subprocess,
    non-placeholder method, basis iff pyscf, solvation-engine pairing, frozen atoms
    required for constrained_preopt, finite options); EngineIdentity; AtomMappingSpec
    (ordered keep/delete/alignment/anchors with disjointness, subset and >= 3 alignment
    checks, check_atom_count for the template index space); ThermoConfig (grimme_qrrho
    defaults, finite > 0). graph.py: Component, TemplateGeometry (concatenated component
    index space, mapping checked against it), ReactionNode (id pattern, unique template
    ids and ranks, equal total charge and element multiset across templates), ReactionEdge,
    PruningRule, ReactionGraph (schema_version 1; unique node and rule ids, known
    endpoints, no self-loops or duplicate edges, defined rule refs; cycles allowed;
    priority_order by (priority, id)). io.py: load_reaction_graph for .yaml/.yml (SafeLoader
    subclass rejecting duplicate keys with line) and .json (duplicate-key object_pairs_hook),
    wrapping read, UTF-8, syntax, nesting-depth, duplicate-key and validation failures
    in GraphValidationError (a ValueError) prefixed by the path; dump_reaction_graph_json.
    Imports only stdlib, pydantic and yaml; no hashing, engines, mapping, connectivity
    or pruning evaluation. Tests in tests/unit/core; example SN2 graph in tests/data/reaction_graphs/example_reaction_graph.yaml.
  inputs:
  - data_type: reaction_graph_file_yaml_or_json
    external: graph_files
  outputs:
  - data_type: validated_reaction_graph_and_core_models
    external: eta_rxncat_consumers
  - data_type: reaction_graph_json
    external: graph_files
  edges:
    depends_on: []
    implements: []
    member_of: []
  provenance:
    last_slice: 10-logo-webp
  review:
    reviewed_at: '2026-11-22T15:33:37+00:00'
    reviewed_by: audit:OPR.0.1.0.10
    summary: reviewed; nothing patched
- id: eta_rxncat_store
  dimension: Module
  status: clean
  files:
  - src/eta_rxncat/store/**
  - tests/unit/store/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.store (v0.1.0): canonical per-stage cache keys and a WAL-mode SQLite
    artifact store. keys.py: canon (sorted-key, compact, ASCII, allow_nan=False JSON)
    and h (sha256 of canon); KEY_SCHEMA = 1; geometry_payload (symbols, coordinates
    snapped to a 5-decimal grid, charge, spin_multiplicity, sorted active_atom_indices;
    metadata excluded); stage_payload (kind, engine, method, basis, solvation, sorted
    frozen_atom_indices, options, engine identity; integral floats as ints); frozen
    StageKey from build_stage_key (ValueError when engine.name != stage.engine). artifact_store.py:
    ArtifactStatus, ArtifactConflictError, StoreSchemaError, StoreBusyError. ArtifactStore(path,
    *, open_timeout_s=5.0): open_timeout_s must be > 0 (ValueError, nothing created);
    an existing parent dir is required (FileNotFoundError). One deadline covers the
    whole open (slice 09, R52): the user_version read, PRAGMA journal_mode=WAL and
    the BEGIN IMMEDIATE schema transaction each run through a private busy step that
    sets busy_timeout to the time remaining and retries SQLITE_BUSY/LOCKED with 5
    ms doubling to 100 ms backoff, raising StoreBusyError (chaining the OperationalError,
    naming the path) at the deadline; other errors propagate. user_version is checked
    before any write, so an unsupported file is rejected untouched; version 0 gets
    the 12-column stage_artifacts table and indexes, then user_version 1; afterwards
    busy_timeout is 5000. put/get/status/invalidate/query use one BEGIN IMMEDIATE
    transaction per write: completed rows are immutable (identical re-put is a no-op,
    any other write raises ArtifactConflictError) and only invalidate deletes them;
    get returns completed payloads only; query returns sorted keys by stage_kind and
    engine. Thread-safe per instance. Imports eta_rxncat.core and the stdlib only.
  inputs:
  - data_type: molecular_state_stage_config_engine_identity
    source_id: eta_rxncat_core
  - data_type: stage_artifact_payload_json
    external: eta_rxncat_consumers
  outputs:
  - data_type: stage_cache_key
    external: eta_rxncat_consumers
  - data_type: stage_artifacts_sqlite
    external: sqlite_store_file
  edges:
    depends_on:
    - eta_rxncat_core
    implements: []
    member_of: []
  provenance:
    last_slice: 10-logo-webp
  review:
    reviewed_at: '2026-11-22T15:33:37+00:00'
    reviewed_by: audit:OPR.0.1.0.10
    summary: reviewed; nothing patched
