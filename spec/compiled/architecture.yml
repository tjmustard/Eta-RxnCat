- id: eta_rxncat_store
  dimension: Module
  status: clean
  files:
  - src/eta_rxncat/store/**
  - tests/unit/store/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.store (v0.1.0): canonical per-stage cache keys and a WAL-mode SQLite
    artifact store. keys.py: canon (sorted-key, compact, ASCII, allow_nan=False JSON)
    and h (sha256 of canon); KEY_SCHEMA = 1; geometry_payload (symbols, coordinates
    snapped to a 5-decimal grid, charge, spin_multiplicity, sorted active_atom_indices;
    metadata excluded); stage_payload (kind, engine, method, basis, solvation, sorted
    frozen_atom_indices, options, engine identity; integral floats as ints); frozen
    StageKey from build_stage_key (ValueError when engine.name != stage.engine). artifact_store.py:
    ArtifactStatus, ArtifactConflictError, StoreSchemaError, StoreBusyError. ArtifactStore(path,
    *, open_timeout_s=5.0): open_timeout_s must be > 0 (ValueError, nothing created);
    an existing parent dir is required (FileNotFoundError). One deadline covers the
    whole open (slice 09, R52): the user_version read, PRAGMA journal_mode=WAL and
    the BEGIN IMMEDIATE schema transaction each run through a private busy step that
    sets busy_timeout to the time remaining and retries SQLITE_BUSY/LOCKED with 5
    ms doubling to 100 ms backoff, raising StoreBusyError (chaining the OperationalError,
    naming the path) at the deadline; other errors propagate. user_version is checked
    before any write, so an unsupported file is rejected untouched; version 0 gets
    the 12-column stage_artifacts table and indexes, then user_version 1; afterwards
    busy_timeout is 5000. put/get/status/invalidate/query use one BEGIN IMMEDIATE
    transaction per write: completed rows are immutable (identical re-put is a no-op,
    any other write raises ArtifactConflictError) and only invalidate deletes them;
    get returns completed payloads only; query returns sorted keys by stage_kind and
    engine. Thread-safe per instance. Imports eta_rxncat.core and the stdlib only.
  inputs:
  - data_type: molecular_state_stage_config_engine_identity
    source_id: eta_rxncat_core
  - data_type: stage_artifact_payload_json
    external: eta_rxncat_consumers
  outputs:
  - data_type: stage_cache_key
    external: eta_rxncat_consumers
  - data_type: stage_artifacts_sqlite
    external: sqlite_store_file
  edges:
    depends_on:
    - eta_rxncat_core
    implements: []
    member_of: []
  provenance:
    last_slice: OPR.0.7.1.6
  review:
    reviewed_at: '2026-11-27T23:19:35+00:00'
    reviewed_by: audit:OPR.0.7.1.6
    summary: reviewed; nothing patched
  spec_refs:
  - OPR.0.1.0.9
- id: eta_rxncat_hw_probe
  dimension: Module
  status: clean
  files:
  - src/eta_rxncat/utils/**
  - tests/unit/utils/**
  - tests/gpu/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.utils.hw_probe (v0.1.0): hardware probe and GPU smoke test. probe_hardware()
    returns a HardwareReport (pydantic, extra=forbid; report_schema 1) of python/platform,
    torch {installed, version, cuda_available, cuda_version}, the first CUDA device
    {name, compute_capability, total/free VRAM, total GiB} or null, gpu4pyscf {installed,
    version}, vram_budget_gib 6.5 and vram_budget_bytes = min(int(6.5 GiB), total)
    or null, and flags in the fixed order torch_missing, torch_import_failed, cuda_unavailable,
    torch_cuda_below_12.8, gpu4pyscf_missing, gpu4pyscf_import_failed, gpu4pyscf_below_1.8.0,
    plus notes. It never raises: imports go through the _import seam and catch Exception;
    a distribution present in metadata whose import raises is reported installed with
    its metadata version, the *_import_failed flag and the note 'Importing <pkg> raised
    <Type>: <msg>' (R43); no retry or fallback. run_smoke(timeout_s=600) returns a
    SmokeResult (result_schema 1): fail, before any child process, when an *_import_failed
    flag is set; skipped, before any child, when torch, CUDA or gpu4pyscf is unavailable;
    otherwise runs python -m eta_rxncat.utils._smoke_child (H2O RHF/STO-3G on gpu4pyscf
    and pyscf, seeded float64 512x512 CUDA matmul without TF32) and passes only if
    both SCFs converged, |dE| <= 1e-6 Eh, mo_coeff is a cupy.ndarray, the matmul ran
    on cuda and max |dC| <= 1e-9; timeout, crash or malformed output -> fail naming
    the cause. smoke_exit_code: pass 0, fail 1, skipped 3. torch/gpu4pyscf/cupy/pyscf
    are imported only inside functions; no imports from core, store or cli; no git,
    nvidia-smi or network. Unit tests use fake hosts via the import seam (R44); tests/gpu/test_smoke.py
    is gpu-marked and deselected by default.
  inputs:
  - data_type: host_torch_cuda_gpu4pyscf_installation
    external: host_environment
  outputs:
  - data_type: hardware_report_and_vram_budget
    external: eta_rxncat_consumers
  - data_type: smoke_result_json_and_exit_code
    external: eta_rxncat_consumers
  edges:
    depends_on: []
    implements: []
    member_of: []
  provenance:
    last_slice: OPR.0.7.1.6
  review:
    reviewed_at: '2026-11-27T23:19:35+00:00'
    reviewed_by: audit:OPR.0.7.1.6
    summary: reviewed; nothing patched
