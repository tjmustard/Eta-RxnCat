  description: >-
    eta_rxncat.mapping.enumerator (v0.7.0, multi-site). enumerate_candidates(plan,
    *, max_alignment_rmsd_angstrom (no default), max_research=DEFAULT_MAX_RESEARCH)
    -> EnumerationResult: one candidate per product of site entries (plan.sites order,
    declared order, last fastest, ids joined '+'). EnumerationError: no site, a (node,
    template) mapped twice in a site, product > max_candidates (before any graft).
    Per template of a covered node by rank, if listed by every covering site (else
    dropped, no record), sites graft in order, stopping at a refusal; one record per
    attempt. Later sites remap through earlier index_maps, keeping appended atoms.
    Checks: multi_component_template; multiplicity_conflict (applied entries' declared,
    else template's); site_atom_deleted; graft_input (a frozen index of node stages,
    else default_stages, not kept). Charge: template + applied charge_deltas. Per
    order: wrong length -> graft_input; parity; else graft (GraftInputError/AlignmentError/ValidationError
    -> graft_input, GraftClashError -> graft_clash). Lowest RMSD wins, ties first;
    all refused -> first reason. Then alignment_rmsd; composition_mismatch (last site
    only: charge or elements vs the node's first eligible product); forming_bond_deleted.
    Each index_map refers to its graft input (prior product after site 1); mapped_forming_bonds
    to its product. Candidate: unmappable (node id); inconsistent partial_pathway_coverage:<site>,
    frozen_index_mismatch:<node>, rank-1 ts_{composition,charge,multiplicity}_mismatch,
    reactant_{composition,charge}_mismatch, entry_multiset_mismatch:<set> (TS entries
    != reactant union); else ok (detail dropped_unlisted:<node>/<template>,...): graph
    <ref>__<id>, eligible products ranked 1..k as <template>__<id>, node stages =
    composed frozen indices (defaults only if freezing). Also map_template_indices,
    projected_ts_searches. Pure, deterministic, uncached; imports core, mapping; not
    re-exported. Also under mapping's glob (recorded overlap). Tests: test_enumerator*.py.
  inputs:
  - data_type: reaction_graph_and_enumeration_plan_models
    source_id: eta_rxncat_core
  - data_type: graft_result
    source_id: eta_rxncat_mapping
