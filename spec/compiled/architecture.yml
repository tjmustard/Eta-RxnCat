- id: eta_rxncat_core
  dimension: Module
  status: dirty
  files:
  - src/eta_rxncat/core/**
  - tests/unit/core/**
  - tests/data/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.core (v0.1.0, v0.2.0): strict, frozen Pydantic v2 contracts (extra=forbid)
    and the ReactionGraph loader. elements.py: Z 1-118 symbols and ATOMIC_NUMBERS.
    models.py: MolecularState (canonical symbols, finite N x 3 Angstrom coordinates,
    StrictInt charge and spin_multiplicity >= 1 with electron parity check, unique
    active_atom_indices, scalar metadata); Solvation (none/ddcosmo/pcm/alpb); StageConfig
    (kind, engine tag rdkit_ff/mace/uma_direct/pyscf_gpu_cpu/xtb_subprocess/esen_omol25
    (one per model family), non-placeholder method, basis iff pyscf, solvation-engine
    pairing, frozen atoms required for constrained_preopt); EngineIdentity; AtomMappingSpec
    (ordered keep/delete/alignment/anchors, disjoint, >= 3 alignment, check_atom_count);
    ThermoConfig (grimme_qrrho defaults). results.py (v0.2.0): PotentialResult, the
    engine return contract in atomic units: finite energy_hartree, forces -dE/dx N
    x 3 Eh/Bohr (>= 1 row), Cartesian Hessian 3N x 3N Eh/Bohr^2 (not mass-weighted
    or projected, validated exactly symmetric, never symmetrised by the model; side
    = 3 x force rows), hessian_method and hessian_max_asymmetry set iff the Hessian
    is, engine EngineIdentity, StrictInt stage_engine_impl >= 1, device cpu/cuda,
    device_reason, wall_time_s >= 0, recovery_steps. graph.py: Component, TemplateGeometry
    (concatenated component index space), ReactionNode (unique template ids and ranks,
    equal charge and element multiset across templates), ReactionEdge, PruningRule,
    ReactionGraph (schema_version 1; unique ids, known endpoints, no self-loops or
    duplicate edges, defined rule refs; cycles allowed; priority_order by (priority,
    id)). io.py: load_reaction_graph for .yaml/.yml and .json, rejecting duplicate
    keys, wrapping every load failure in GraphValidationError (a ValueError) prefixed
    by the path; dump_reaction_graph_json. Imports only stdlib, pydantic and yaml;
    no numpy, engines or hashing. Tests in tests/unit/core; example graph in tests/data/reaction_graphs/.
  inputs:
  - data_type: reaction_graph_file_yaml_or_json
    external: graph_files
  outputs:
  - data_type: validated_reaction_graph_and_core_models
    external: eta_rxncat_consumers
  - data_type: reaction_graph_json
    external: graph_files
