  description: >-
    eta_rxncat.engines (v0.2.0): pure Python at import, no ase in src. Shared: base.py
    Engine ABC (from_stage, evaluate -> PotentialResult), errors.py, units.py (CODATA
    2018), options.py resolved stage (R6), identity.py, fd.py. rdkit_ff.py: UFF/MMFF94,
    neutral closed-shell only (R35), perception round-trip, fresh force field per
    geometry. pyscf_gpu_cpu/: DF R/U KS/HF; keyed DF, auxbasis, ecp auto per state
    (R36), grids, conv_tol, guess, PCM method, small basis, hessian_mode, cartesian_basis
    (mol.cart, every Mole, keyed only when True, no atom guess; R30); ladder diis
    -> level_shift -> soscf -> small-basis projection, then internal stability on
    lambda_min from PySCF's replayed operator (stability.py, pinned 2.15.1/1.9.2):
    unstable iff lambda_min < -stability_tol (1e-3), follows lowering E < stability_noise_eh
    (1e-6) end as stable (R54, ENGINE_IMPL 2); ddCOSMO/PCM; HF analytic, KS FD Hessian
    on CPU (R41). Unkeyed device: GPU4PySCF on the same stage, ddCOSMO on cpu, calibrated
    VRAM estimate vs the ADR-0008 budget, cpu re-run on the 4 CUDA OOMs, GPU KS analytic
    Hessian only for classes (RKS|UKS, solvation, ECP, grid) recorded <= 1e-4 in pyscf-gpu-support.json
    (R44/R51; UKS IEF-PCM -> FD), CPU-copy stability below 3 rotations (R43), device_reason
    per CPU choice. xtb_subprocess.py: external xtb 6.8.0, list argv, no shell, always
    --grad, keyed ALPB state; Hessian FD of gradients (R45). mace.py: MACE-MP-0 medium
    from a sha256-pinned model_path checked before torch.load, float64, neutral closed-shell.
    _fairchem_bridge.py + uma_direct.py (uma-s-1p2p1) + esen_omol25.py (esen-sm-conserving-all-omol;
    direct-force and allscaip names refused): offline get_predict_unit path (cached
    files or checkpoint_path), keyed task omol and inference_settings high-precision
    (R47), derived keyed atom_refs_sha256 / form_elem_refs_sha256 (R40), direct-force
    models refused, AtomicData with charge and spin, identity <method>@sha256:<hex>,
    FD Hessian. Tests: tests/unit/engines, tests/acceptance.
  inputs:
