- id: eta_rxncat_engines
  dimension: Module
  status: dirty
  files:
  - src/eta_rxncat/engines/**
  - tests/unit/engines/**
  - tests/acceptance/**
  description: >-
    eta_rxncat.engines (v0.2.0): what every engine shares; pure Python, heavy libraries
    imported lazily inside engines. base.py: Engine ABC (class tag: EngineTag, ENGINE_IMPL,
    OPTIONS); __init__/from_stage(stage, **runtime) rejects a foreign tag or unknown
    runtime argument and stores the resolved stage; abstract identity and _evaluate
    -> RawResult; evaluate times the call, checks forces/Hessian presence and shapes
    against the state, copies lists and returns a validated PotentialResult (stage_engine_impl
    = ENGINE_IMPL), invalid output -> EngineRuntimeError. errors.py: EngineError and
    EngineUnavailableError, EngineInputError, ScfConvergenceError(steps tuple), EngineRuntimeError(tail:
    last 40 lines, redacted). units.py: CODATA 2018 BOHR_ANGSTROM, HARTREE_EV, HARTREE_KCAL_MOL
    and conversions. options.py: OptionSpec(type, default, allowed); resolve_options
    fills defaults, rejects unknown keys, wrong types (bool never int/float), disallowed
    values and a caller-set engine_impl, and adds engine_impl; resolved_stage returns
    a new StageConfig with resolved options and the solvent lowercased, so implicit
    and explicit defaults key the same (R6, ADR-0016). identity.py: sha256_file (1
    MiB chunks), model_id '<name>@sha256:<hex>' (never a path), library_version via
    importlib.metadata (absent -> EngineUnavailableError). fd.py: fd_hessian, central
    differences of forces (6N calls), symmetrised, with the pre-symmetrisation max
    asymmetry. rdkit_ff.py: RDKitFFEngine (method uff|mmff94, keyed fd_step_bohr)
    refuses charge != 0 or multiplicity != 1 first (R35), then perception failure
    (ValueError), a round-trip mismatch (elements, formal charge, radicals, implicit
    H) and missing parameters; forces from a fresh force field per geometry (RDKit
    2026.09 CalcGrad(positions) is history-dependent); FD Hessian; cpu. Tests in tests/unit/engines
    (five-state test set in data/); acceptance tests will live in tests/acceptance.
  inputs: []
  outputs: []
