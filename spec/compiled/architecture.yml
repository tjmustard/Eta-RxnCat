  description: >-
    eta_rxncat.thermo (v0.3.0; TS validation v0.5.0): ideal-gas thermochemistry derived
    from a stored Cartesian Hessian (never stored itself), in its own package so eta_rxncat.core
    stays numpy-free. constants.py: CODATA 2018 constants and the Eh/(Bohr^2 amu)
    -> cm^-1 conversion; a test derives engines.units HARTREE_KCAL_MOL and BOHR_ANGSTROM
    from them. masses.py: RDKit most-common-isotope masses, masses_source, error on
    a miss (no fallback). _geometry.py: shared helpers (centre of mass, moments, linearity,
    proper-rotation Kabsch RMSD, permuted RMSD, capped graph automorphisms). modes.py:
    normal_modes symmetrises and mass-weights the Hessian, projects rigid motions
    (SVD rank 3/5/6), giving 0/3N-5/3N-6 ascending frequencies (imaginary negative)
    and unit Cartesian mode vectors; |nu| < 1e-3 cm^-1 is an error. symmetry.py: rotational
    symmetry number from automorphisms realised by a proper rotation within sym_tol
    (linear: 2 if centrosymmetric, else 1; cap reached is an error), from a SMILES
    or (v0.5.0) a given bond graph (unsanitised single bonds, no implicit H). rrho.py:
    thermochemistry (sigma from SMILES) over _thermochemistry(sigma): Sackur-Tetrode
    translation, rigid rotor with sigma, RRHO ZPE/thermal energy, Grimme quasi-RRHO
    entropy with B_av, electronic R ln(2S+1), 1 M standard-state term; returns core
    ThermoResult; imaginary modes excluded and listed, soft modes at |nu|. boltzmann.py:
    log-sum-exp weights and ensemble G with degeneracies. errors.py: ThermoError,
    ThermoInputError, NotAMinimumError, check_ground_state. ts.py (v0.5.0): validate_transition_state
    -> core TSValidation (TJ A2: one mode below -imag_tol, below cutoff, mass-weighted
    active-core KE fraction; R3 identity: forming-stretch overlap, in-phase bonds,
    distance window; refusals TSValidationInputError); ts_thermochemistry (needs a
    mode-count pass, sigma from bonds, exactly the validated imaginary excluded).
    Bonds are passed in; no mapping/orchestrator import. Tests: tests/unit/thermo.
  inputs:
  - data_type: molecular_state_thermo_config_and_analysis_options
    source_id: eta_rxncat_core
  - data_type: ts_validation_options_and_ts_validation
    source_id: eta_rxncat_core
  - data_type: cartesian_hessian_electronic_energy_smiles_or_bonds
    external: eta_rxncat_consumers
  outputs:
  - data_type: thermo_result_normal_modes_symmetry_number
    external: eta_rxncat_consumers
  - data_type: boltzmann_weights_and_ensemble_gibbs
    external: eta_rxncat_consumers
  - data_type: ts_validation_and_ts_thermo_result
    external: eta_rxncat_consumers
  edges:
