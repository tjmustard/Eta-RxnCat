- id: eta_rxncat_core
  dimension: Module
  status: clean
  files:
  - src/eta_rxncat/core/**
  - tests/unit/core/**
  - tests/data/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.core: frozen, extra=forbid, strict Pydantic v2 contracts and ReactionGraph
    loader. elements.py: Z 1-118. models.py: MolecularState (symbols, Angstrom coords,
    charge, multiplicity, active atoms); Solvation; StageConfig (incl. ts_opt, constrained_preopt,
    basis iff pyscf); EngineIdentity; AtomMappingSpec; ThermoConfig. results.py: PotentialResult
    (atomic units: energy, forces, Hessian, engine, device, wall time). thermo_models.py:
    ThermoAnalysisOptions, ThermoResult (E, ZPE, H/G, entropy, frequencies, G). optimization_models.py:
    OptimizerIdentity (geometric|prfo), OptimizationResult (optional frames, omitted
    when None), OptimizationFrame (coords, E, max gradient, ladder_step). ensemble_models.py:
    ConformerRecord, ConformerEnsemble (weights sum 1). mapping_models.py: GraftSpec,
    GraftResult, CloseContact, JunctionVolume. ts_models.py: FormingBond, TSStep (optional
    coordinates_angstrom, omitted when None), TSSearchResult, TSValidationOptions
    (-20/-50/0.60), TSValidation (TS_VALIDATION_REASONS), TransitionStateRecord. graph.py:
    ReactionGraph (nodes, edges, templates, PruningRule; optional pathway, PathwayPruningRule
    ddG_dagger on priority-1 nodes; rule ids unique). selectivity_models.py: TSEnsembleOptions,
    Member (source seed|fragment_embed:k|perturb:k, sha256, G, face, weight), Exclusion
    (closed reasons incl. orientation_mismatch), Merge, TSEnsemble (G_pathway xor
    failed_reason); PruningDecision, SelectivityResult (ddG '<b>_vs_<a>', kind ee|de|regio).
    enumeration_models.py (v0.7.0): SiteTemplateMap (sorted forming_bonds, no anchors),
    EnumerationSite, LibraryEntry (>=1 unique fragment_orders), PathwaySpec (expected_face
    +-1), SelectivitySet, EnumerationPlan (unique ids, refs into reference_graph),
    GraftRecord (closed GraftRefusalReason), EnumeratedCandidate (graph iff ok), EnumerationResult,
    FallbackAttempt, FallbackRecord (chosen xor stop; ranks increase). io.py: YAML/JSON
    load, JSON dump. Stdlib, pydantic, yaml only (no numpy/RDKit).
  inputs:
  - data_type: reaction_graph_file_yaml_or_json
    external: graph_files
  outputs:
  - data_type: validated_reaction_graph_and_core_models
    external: eta_rxncat_consumers
  - data_type: reaction_graph_json
    external: graph_files
