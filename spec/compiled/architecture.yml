  description: >-
    uv-managed MIT package skeleton for eta-rxncat 0.1.0 (hatchling, src layout, requires-python
    >=3.11,<3.14, .python-version 3.12, committed uv.lock). Runtime deps numpy, scipy,
    pydantic>=2, pyyaml, rdkit, geometric, pyscf. Optional extras (slice 06, floors
    only): gpu = torch>=2.7.0, gpu4pyscf-cuda12x>=1.8.0, cupy-cuda12x; mlip-mace =
    torch, mace-torch; mlip-uma = torch, fairchem-core. [tool.uv] conflicts makes
    the MLIP extras mutually exclusive (one lock, forked e3nn 0.4.4 / 0.6.0); torch
    comes only from the explicit pytorch-cu128 index (locked 2.8.0+cu128). [project.scripts]
    declares the eta-rxncat console script (eta_rxncat.cli:main). __init__ exposes
    __version__ and imports no heavy backend; engines, conformers, mapping, optimize
    and orchestrator are empty placeholders. Gates: ruff (E,F,W,I,D; google docstrings;
    force-exclude docs/prd and .agents), strict mypy over src and tools, pytest with
    the gpu marker deselected. Licence gate tools/licence_gate.py (stdlib only, run
    by the target env's interpreter with -I, --profile base|gpu|mlip-mace|mlip-uma)
    judges each installed distribution exactly from License-Expression (SPDX AND/OR/WITH),
    else License classifiers, else the License field, against [tool.eta-rxncat.licence-gate]
    in pyproject.toml; no substring matching. Exemptions are version-pinned per profile
    and stale ones fail: geometric:1.1.1 (R41) everywhere, nvidia-* proprietary wheels
    in gpu and MLIP profiles (TJ Q1 A), and the R48 transitive copyleft/off-list lists
    in mlip-mace / mlip-uma only. tests/unit/test_package.py bans importing sella,
    tblite, psi4 and the copyleft-exempt modules under src and declaring those distributions
    directly. CI: checks job (sync, four gates, base licence gate) plus a licence-extras
    matrix (gpu, gpu+mlip-mace, gpu+mlip-uma); no GPU job. docs/prd/v0.1.0/ holds
    the verbatim starter and DISCREPANCIES.md; README and AGENTS.md project rules
    sit outside the HACF managed blocks.
  inputs: []
