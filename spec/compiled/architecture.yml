  description: >-
    uv-managed MIT package skeleton for eta-rxncat 0.1.0 (hatchling, src layout, requires-python
    >=3.11,<3.14, .python-version 3.12, committed uv.lock). Runtime deps numpy, scipy,
    pydantic>=2, pyyaml, rdkit, geometric, pyscf; no optional extras. src/eta_rxncat/__init__.py
    exposes __version__ = "0.1.0" and imports no heavy backend; engines, conformers,
    mapping, optimize and orchestrator are empty placeholder packages (filled v0.2.0-v0.8.0).
    Gates in pyproject.toml: ruff (E,F,W,I,D; google docstrings; force-exclude with
    extend-exclude docs/prd and .agents), strict mypy over src, pytest over tests
    with gpu marker deselected. Runtime-only licence gate: [tool.pip-licenses] allow-only
    MIT;BSD;Apache;ISC;PSF with one version-pinned exception geometric:1.1.1 (ADR-0011),
    run against .venv-runtime with pip-licenses 5.5.5. CI (.github/workflows/ci.yml)
    runs uv sync --locked, the four gates and the licence gate. docs/prd/v0.1.0/ holds
    the verbatim v0.1.0 reference starter (23 files + .ruff.toml gate file) and DISCREPANCIES.md;
    docs/prd/PLAN_DISCREPANCIES.md registers plan-copy differences. README and AGENTS.md
    project rules sit outside the HACF managed blocks.
  inputs: []
