  description: >-
    eta_rxncat.cli (v0.1.0): the eta-rxncat console script (pyproject [project.scripts]
    eta-rxncat = eta_rxncat.cli:main; python -m eta_rxncat via __main__.py, the only
    raise SystemExit(main())). main(argv) -> int on stdlib argparse, never calls sys.exit;
    argparse usage errors (no or unknown command, missing argument) return 2. hardware-check
    prints probe_hardware() as indented JSON and returns 0; hardware-check --smoke
    prints run_smoke() as JSON and returns smoke_exit_code (0 pass, 1 fail, 3 skipped);
    hw_probe is imported lazily inside the handler. validate <path> loads the graph
    with load_reaction_graph and prints exactly 'OK <path>', 'nodes: N', 'edges: M',
    'priority_order: ids' (exit 0); a GraphValidationError (the only exception caught)
    becomes one 'error: <message>' stderr line with whitespace collapsed, empty stdout,
    exit 1, no traceback. validate imports no torch, pyscf, gpu4pyscf, cupy, rdkit,
    mace or fairchem; no store import; no dependency beyond the stdlib and the project.
    Planned for v0.7.0 (not yet written): a review-bundle subcommand over eta_rxncat.review
    (edge recorded ahead of the code).
