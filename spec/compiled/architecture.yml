  description: >-
    eta_rxncat.optimize: geometry optimizers (v0.3.0) and the clean-room P-RFO TS
    search (v0.5.0, TJ A1). geomeTRIC is the optional opt-geometric extra (TJ Q3 A),
    never imported by core or the base install. errors.py: OptimizerError -> OptimizerUnavailableError
    (names uv sync --extra opt-geometric), OptimizerInputError, OptimizationFailedError(steps,
    last_energy_hartree) -> TSSearchFailedError(reason: max_steps|too_many_rejections|mode_lost|no_reaction_mode|wall_time_exceeded);
    none is a ValueError. base.py (pure Python): Optimizer ABC (identity, OPTIONS
    resolved by the ADR-0016 rule, minimize(state, engine, *, frozen_atom_indices,
    dihedral_constraints, options) -> OptimizationResult); DihedralConstraint; check_constraints;
    constraints_text (canonical freeze:/dihedral: text, recorded as options["constraints"]).
    geometric_impl.py: GeometricOptimizer imports geomeTRIC only inside functions;
    OptParams, Molecule, coordsys tric/cart/dlc/hdlc, parse_constraints, optimizeGeometry
    via a bridge to Engine.evaluate that never catches EngineError; fresh temp dir,
    logger and numpy RNG restored. Options coordsys, convergence_set, maxiter, trust,
    hessian; ladder tric, tric_tight_trust, then cartesian or hdlc. ts_base.py (pure
    Python, R12): TransitionStateOptimizer ABC, separate from Optimizer; find_saddle(state,
    engine, *, forming_bonds, options) -> TSSearchResult; 'constraints' refused, no
    frozen atoms or dihedrals (R21). prfo.py (numpy, base install): PRFOOptimizer,
    identity prfo src-<sha256(prfo.py)[:16]> (R11). Unweighted Cartesian Bohr, rigid
    motions about the centroid projected out (R7, no masses or thermo); exact Hessian
    at step 0, every 5th accepted step and after a rejection, Bofill between (identity
    at r = 0 or s = 0, R29); initial mode = max forming-stretch overlap, then max
    overlap with the previous mode; Baker P-RFO step, trust radius, ratio accept/reject;
    four convergence criteria (R24); no Hessian after convergence (R27). Tests in
    tests/unit/optimize.
  inputs:
  - data_type: molecular_state_constraints_and_forming_bonds
    source_id: eta_rxncat_core
