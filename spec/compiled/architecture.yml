- id: eta_rxncat_thermo
  dimension: Module
  status: clean
  associated_file: src/eta_rxncat/thermo/__init__.py
  files:
  - src/eta_rxncat/thermo/**
  - tests/unit/thermo/**
  description: >-
    eta_rxncat.thermo (v0.3.0; TS validation v0.5.0): ideal-gas thermochemistry derived
    from a stored Cartesian Hessian (never stored itself), in its own package so eta_rxncat.core
    stays numpy-free. __init__ (v0.6.0 R26): masses/modes/rrho/symmetry/ts names load
    lazily (PEP 562), so constants and boltzmann import without RDKit. constants.py:
    CODATA 2018 constants and the Eh/(Bohr^2 amu) -> cm^-1 conversion; a test derives
    engines.units HARTREE_KCAL_MOL and BOHR_ANGSTROM from them. masses.py: RDKit isotope
    masses, masses_source, no fallback. _geometry.py: shared helpers (centre of mass,
    moments, linearity, proper-rotation Kabsch RMSD, permuted RMSD, capped graph automorphisms).
    modes.py: normal_modes mass-weights the Hessian, projects rigid motions (SVD),
    ascending frequencies (imaginary negative) and unit Cartesian modes; |nu| < 1e-3
    cm^-1 is an error. symmetry.py: rotational symmetry number from automorphisms
    realised by a proper rotation within sym_tol (linear: 2 if centrosymmetric, else
    1; cap reached is an error), from a SMILES or (v0.5.0) a given bond graph (unsanitised
    single bonds, no implicit H). rrho.py: thermochemistry (sigma from SMILES): Sackur-Tetrode,
    rigid rotor, RRHO ZPE, Grimme quasi-RRHO entropy, electronic R ln(2S+1), 1 M term;
    returns core ThermoResult; imaginary modes excluded and listed, soft modes at
    |nu|. boltzmann.py: log-sum-exp weights and ensemble G with degeneracies. errors.py:
    ThermoError, ThermoInputError, NotAMinimumError, check_ground_state. ts.py (v0.5.0):
    validate_transition_state -> core TSValidation (TJ A2: one mode below -imag_tol,
    below cutoff, mass-weighted active-core KE fraction; R3 identity: forming-stretch
    overlap, in-phase bonds, distance window; refusals TSValidationInputError); ts_thermochemistry
    (needs a mode-count pass, sigma from bonds, exactly the validated imaginary excluded).
    Bonds are passed in; no mapping/orchestrator import. Tests: tests/unit/thermo.
  inputs:
  - data_type: molecular_state_thermo_config_and_analysis_options
    source_id: eta_rxncat_core
  - data_type: ts_validation_options_and_ts_validation
    source_id: eta_rxncat_core
  - data_type: cartesian_hessian_electronic_energy_smiles_or_bonds
    external: eta_rxncat_consumers
  outputs:
  - data_type: thermo_result_normal_modes_symmetry_number
    external: eta_rxncat_consumers
  - data_type: boltzmann_weights_and_ensemble_gibbs
    external: eta_rxncat_consumers
  - data_type: ts_validation_and_ts_thermo_result
    external: eta_rxncat_consumers
  edges:
    depends_on:
    - eta_rxncat_core
    implements: []
    member_of: []
  spec_refs:
