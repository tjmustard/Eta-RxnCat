- id: eta_rxncat_store
  dimension: Module
  status: dirty
  files:
  - src/eta_rxncat/store/**
  - tests/unit/store/**
  - docs/prd/v0.1.0/DISCREPANCIES.md
  - spec/compiled/architecture.yml
  description: >-
    eta_rxncat.store (v0.1.0): canonical per-stage cache keys and a WAL-mode SQLite
    artifact store. keys.py: canon (sorted-key, compact, ASCII, allow_nan=False JSON)
    and h (sha256 of canon); KEY_SCHEMA = 1; geometry_payload (symbols, coordinates
    snapped to a 5-decimal grid, charge, spin_multiplicity, sorted active_atom_indices;
    metadata excluded); stage_payload (kind, engine, method, basis, solvation, sorted
    frozen_atom_indices, options, engine identity; integral floats as ints); frozen
    StageKey from build_stage_key (ValueError when engine.name != stage.engine). artifact_store.py:
    ArtifactStatus, ArtifactConflictError, StoreSchemaError, StoreBusyError. ArtifactStore(path,
    *, open_timeout_s=5.0): open_timeout_s must be > 0 (ValueError, nothing created);
    an existing parent dir is required (FileNotFoundError). One deadline covers the
    whole open (slice 09, R52): the user_version read, PRAGMA journal_mode=WAL and
    the BEGIN IMMEDIATE schema transaction each run through a private busy step that
    sets busy_timeout to the time remaining and retries SQLITE_BUSY/LOCKED with 5
    ms doubling to 100 ms backoff, raising StoreBusyError (chaining the OperationalError,
    naming the path) at the deadline; other errors propagate. user_version is checked
    before any write, so an unsupported file is rejected untouched; version 0 gets
    the 12-column stage_artifacts table and indexes, then user_version 1; afterwards
    busy_timeout is 5000. put/get/status/invalidate/query use one BEGIN IMMEDIATE
    transaction per write: completed rows are immutable (identical re-put is a no-op,
    any other write raises ArtifactConflictError) and only invalidate deletes them;
    get returns completed payloads only; query returns sorted keys by stage_kind and
    engine. Thread-safe per instance. Imports eta_rxncat.core and the stdlib only.
  inputs:
  - data_type: molecular_state_stage_config_engine_identity
    source_id: eta_rxncat_core
  - data_type: stage_artifact_payload_json
    external: eta_rxncat_consumers
  outputs:
  - data_type: stage_cache_key
    external: eta_rxncat_consumers
  - data_type: stage_artifacts_sqlite
    external: sqlite_store_file
