  description: >-
    eta_rxncat.core: frozen, extra=forbid, strict Pydantic v2 contracts and the ReactionGraph
    loader. elements.py: Z 1-118, ATOMIC_NUMBERS. models.py: MolecularState (symbols,
    finite Angstrom coords, StrictInt charge, multiplicity with electron parity, unique
    active atoms, scalar metadata); Solvation (none/ddcosmo/pcm/alpb); StageConfig
    (kind incl. v0.5.0 ts_opt, engine tag, method, basis iff pyscf, solvation pairing,
    frozen atoms for constrained_preopt); EngineIdentity; AtomMappingSpec (disjoint
    ordered lists, >= 3 alignment); ThermoConfig (grimme_qrrho). results.py: PotentialResult
    (atomic units: energy, forces, symmetric Hessian with method/asymmetry, engine,
    device, wall time, recovery_steps). thermo_models.py: ThermoAnalysisOptions; ThermoResult
    (E, ZPE, H/G corrections, four entropy parts, sigma, is_linear, ascending frequencies,
    imaginary/soft lists, G = E + G corr, masses_source). optimization_models.py:
    OptimizerIdentity (geometric|prfo); OptimizationResult (converged, steps, engine
    calls, recovery_steps). ensemble_models.py: ConformerRecord (degeneracy 1/2);
    ConformerEnsemble (weights sum 1, lowest_index argmin G). mapping_models.py (v0.4.0):
    GraftSpec (template mapping, 1:1 fragment_alignment, delete disjoint, core within
    keep, product charge/multiplicity, four tolerances); GraftResult (product, index_map,
    RMSD, ascending in-range index lists); CloseContact; JunctionVolume. ts_models.py
    (v0.5.0, R1): FormingBond (i < j); TSStep; TSSearchResult (converged strictly
    True, forming_bonds ascending in range, history[k].step == k, never compared);
    TSValidationOptions (TJ A2 -20/-50/0.60; R3 overlap/distance window); TSValidation
    (passed == three checks; reasons sorted, from TS_VALIDATION_REASONS, empty iff
    passed); TransitionStateRecord (mode count passed, one imaginary, state == search.final_state,
    degeneracy 1). graph.py: ReactionGraph (nodes, edges, templates, pruning). io.py:
    YAML/JSON load (GraphValidationError), JSON dump. Stdlib, pydantic, yaml only.
  inputs:
