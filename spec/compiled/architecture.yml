  description: >-
    uv-managed MIT package skeleton for eta-rxncat 0.1.0 (hatchling, src layout, Python
    >=3.11,<3.14, .python-version 3.12, committed uv.lock). Runtime deps numpy, scipy,
    pydantic>=2, pyyaml, rdkit, geometric, pyscf. Extras (floors only): gpu = torch>=2.7.0,
    gpu4pyscf-cuda12x>=1.8.0, cupy-cuda12x; mlip-mace = torch, mace-torch; mlip-uma
    = torch, fairchem-core; [tool.uv] conflicts keeps the MLIP extras mutually exclusive;
    torch only from the explicit pytorch-cu128 index. [project.scripts] eta-rxncat
    = eta_rxncat.cli:main. __init__ exposes __version__ and imports no backend; engines,
    conformers, mapping, optimize, orchestrator are empty placeholders. Gates: ruff,
    strict mypy over src and tools, pytest with the gpu marker deselected. Licence
    gate tools/licence_gate.py (stdlib, run by the target env's interpreter, --profile
    base|gpu|mlip-mace|mlip-uma) judges each installed distribution exactly (SPDX
    expression, else classifiers, else License field) against [tool.eta-rxncat.licence-gate];
    no substring matching; version-pinned per-profile exemptions (geometric R41, nvidia-*
    wheels Q1 A, R48 MLIP transitive lists), stale ones fail. tests/unit/test_package.py
    bans copyleft and sella/tblite/psi4 imports and direct copyleft deps. CI: checks
    job plus a licence-extras matrix; no GPU job. Public face (slice 08): README.md
    (logo/banner header, badges, TOC, Features/Usage limited to v0.1.0, Roadmap, nMap
    DOI and Eta_Scripts, licensing), CHANGELOG.md (Keep a Changelog, [Unreleased]
    only; scribe-owned), size-named WebP media (media/icons/icon-<N>.webp, media/banner/banner-<W>x<H>.webp;
    README embeds the next size up, icon-256 and banner-1024x573, enforced by tests/unit/test_media.py),
    LICENSE (MIT). Author form Thomas J. L. Mustard Ph.D. in LICENSE, README and pyproject,
    enforced by tests/unit/test_identity.py (filesystem-only whole-text regex scan
    with fixed exclusions). docs/prd/v0.1.0/ holds the verbatim starter and DISCREPANCIES.md.
  inputs: []
