  description: >-
    eta_rxncat.utils.hw_probe (v0.1.0): hardware probe and GPU smoke test. probe_hardware()
    returns a HardwareReport (pydantic, extra=forbid; report_schema 1) of python/platform,
    torch {installed, version, cuda_available, cuda_version}, the first CUDA device
    {name, compute_capability, total/free VRAM, total GiB} or null, gpu4pyscf {installed,
    version}, vram_budget_gib 6.5 and vram_budget_bytes = min(int(6.5 GiB), total)
    or null, and flags in the fixed order torch_missing, torch_import_failed, cuda_unavailable,
    torch_cuda_below_12.8, gpu4pyscf_missing, gpu4pyscf_import_failed, gpu4pyscf_below_1.8.0,
    plus notes. It never raises: imports go through the _import seam and catch Exception;
    a distribution present in metadata whose import raises is reported installed with
    its metadata version, the *_import_failed flag and the note 'Importing <pkg> raised
    <Type>: <msg>' (R43); no retry or fallback. run_smoke(timeout_s=600) returns a
    SmokeResult (result_schema 1): fail, before any child process, when an *_import_failed
    flag is set; skipped, before any child, when torch, CUDA or gpu4pyscf is unavailable;
    otherwise runs python -m eta_rxncat.utils._smoke_child (H2O RHF/STO-3G on gpu4pyscf
    and pyscf, seeded float64 512x512 CUDA matmul without TF32) and passes only if
    both SCFs converged, |dE| <= 1e-6 Eh, mo_coeff is a cupy.ndarray, the matmul ran
    on cuda and max |dC| <= 1e-9; timeout, crash or malformed output -> fail naming
    the cause. smoke_exit_code: pass 0, fail 1, skipped 3. torch/gpu4pyscf/cupy/pyscf
    are imported only inside functions; no imports from core, store or cli; no git,
    nvidia-smi or network. Unit tests use fake hosts via the import seam (R44); tests/gpu/test_smoke.py
    is gpu-marked and deselected by default.
  inputs:
  - data_type: host_torch_cuda_gpu4pyscf_installation
    external: host_environment
  outputs:
  - data_type: hardware_report_and_vram_budget
    external: eta_rxncat_consumers
  - data_type: smoke_result_json_and_exit_code
    external: eta_rxncat_consumers
  edges:
    depends_on: []
    implements: []
    member_of: []
  provenance:
    last_slice: 05-ts-runner
  review:
    reviewed_at: '2026-11-24T06:09:51+00:00'
    reviewed_by: audit:05-ts-runner
    summary: reviewed; nothing patched
