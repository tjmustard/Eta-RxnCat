  description: >-
    uv-managed MIT package eta-rxncat 0.4.0 (hatchling, src layout, Python >=3.11,<3.14,
    committed uv.lock). Runtime deps numpy, scipy, pydantic>=2, pyyaml, rdkit, pyscf.
    Extras: gpu (torch, gpu4pyscf-cuda12x, cupy-cuda12x), mlip-mace (mace-torch),
    mlip-uma (fairchem-core>=2.22), opt-geometric (geometric==1.1.1, also in dev;
    TJ v0.3.0 Q3 A); [tool.uv] conflicts keep the MLIP extras exclusive; torch 2.13.0+cu129
    only from the explicit pytorch-cu129 index. Script eta-rxncat = eta_rxncat.cli:main.
    __init__ imports no backend; mapping is its own node. Gates: ruff, strict mypy,
    pytest. Test policy (ADR-0019): markers gpu, xtb, mlip_mace, mlip_uma, slow, acceptance,
    e2e deselected by default; tests/conftest.py sets HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE=1
    and, under ETA_RXNCAT_ACCEPTANCE=1, fails every skip and xfail; an AST rule bans
    module-level skips in engine and acceptance tests; .venv-accept-* gitignored.
    tools/licence_gate.py (--profile base|opt-geometric|gpu|mlip-mace|mlip-uma) judges
    each installed distribution exactly against [tool.eta-rxncat.licence-gate] with
    version-pinned per-profile exemptions (base none; geometric 1.1.1 in opt-geometric
    and, via gpu4pyscf-cuda12x, gpu/mlip-*); stale exemptions, unnamed or duplicate
    dist-infos fail. test_package.py bans copyleft imports, heavy imports at engines/optimize
    import, and geometric outside functions of optimize/geometric_impl.py. CI: checks
    plus licence-extras matrix. Public face: README.md, CHANGELOG.md (scribe-owned),
