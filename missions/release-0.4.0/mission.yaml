schema: openrig.mission/v0alpha1
kind: mission
# The project proof rollup counts only missions whose status is active or
# release-candidate. A new mission is planned, so it stays outside the rollup
# until you change this to active (or release-candidate).
metadata:
  name: "release-0.4.0"
  status: planned
composition:
  mission_markdown:
    spec: SPEC.md
  slices:
    - ref: slices/01-starter/slice.yaml
      order: 10
      active: true
    - ref: slices/02-graft-contracts/slice.yaml
      order: 20
      active: true
    - ref: slices/03-align/slice.yaml
      order: 30
      active: true
    - ref: slices/04-graft/slice.yaml
      order: 40
      active: true
    - ref: slices/05-constrained-relax/slice.yaml
      order: 50
      active: true
    - ref: slices/06-m1-fixture/slice.yaml
      order: 60
      active: true
    - ref: slices/07-acceptance-record/slice.yaml
      order: 70
      active: true
    - ref: slices/08-acceptance-verdict/slice.yaml
      order: 80
      active: true
