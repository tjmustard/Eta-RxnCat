      order: 10
      active: true
    - ref: slices/02-core-contracts/slice.yaml
      order: 20
      active: true
    - ref: slices/03-thermo/slice.yaml
      order: 30
      active: true
    - ref: slices/04-optimizer/slice.yaml
      order: 40
      active: true
    - ref: slices/05-conformers/slice.yaml
      order: 50
      active: true
    - ref: slices/06-species-runner/slice.yaml
      order: 60
      active: true
    - ref: slices/07-human-fixtures/slice.yaml
      order: 70
      active: true
    - ref: slices/08-e2e5-tiers/slice.yaml
      order: 80
      active: true
    - ref: slices/09-acceptance-record/slice.yaml
      order: 90
      active: true
    - ref: slices/10-acceptance-verdict/slice.yaml
      order: 100
